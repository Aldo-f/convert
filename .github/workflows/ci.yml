name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Check formatting with ruff
        run: ruff format --check src tests

      - name: Run tests with coverage
        run: pytest --cov=convert --cov-report=term-missing --cov-fail-under=85

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Smoke test CLI and package data in isolated venv
        shell: bash
        run: |
          python -m venv /tmp/venv
          source /tmp/venv/bin/activate
          pip install dist/*.whl
          convert --version
          printf '# Hello CI\n\nThis is a smoke test.\n' > /tmp/smoke.md
          convert /tmp/smoke.md /tmp/smoke.docx
          test -s /tmp/smoke.docx
          python - <<'PY'
          from importlib.resources import files
          for rel in [
              "converters/text_to_text/spec.md",
              "converters/audio_to_audio/spec.md",
              "converters/video_to_video/spec.md",
          ]:
              assert files("convert").joinpath(rel).is_file(), f"missing package data: {rel}"
          print("package data present")
          PY
